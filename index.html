
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אדם סבג - מערכת חשבוניות</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f1f4f8;
  color: #202c3b;
  font-family: Arial, sans-serif;
}

header {
  background: #142b45;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 { margin: 0 0 8px; font-size: 28px; }
header p { margin: 0; color: #d5e2ef; }

main {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

h2 { font-size: 20px; margin-top: 0; }

.company {
  text-align: center;
  border-bottom: 2px solid #dce4ec;
  padding-bottom: 20px;
  margin-bottom: 20px;
}

.company h2 {
  font-size: 25px;
  margin: 5px;
  color: #142b45;
}

.company p { margin: 6px; color: #53677c; }

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
}

input, textarea {
  display: block;
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #cbd5df;
  border-radius: 9px;
  font-family: Arial, sans-serif;
  background: white;
}

textarea {
  min-height: 160px;
  resize: vertical;
  line-height: 1.7;
}

#signature {
  display: block;
  width: 100%;
  height: 190px;
  border: 2px dashed #9baabd;
  border-radius: 10px;
  background: white;
  touch-action: none;
  cursor: crosshair;
}

.hint {
  color: #708095;
  font-size: 13px;
  line-height: 1.6;
}

button {
  padding: 13px 18px;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px 2px;
}

.primary { background: #1768ad; color: white; }
.whatsapp { background: #20b85a; color: white; }
.email { background: #8054b8; color: white; }
.secondary { background: #e7edf4; color: #203b58; }
.danger { background: #fbe7e7; color: #a32626; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 18px;
}

.actions button { flex: 1; }

.invoice {
  display: none;
  background: white;
  padding: 30px;
  border: 1px solid #dce3ea;
  border-radius: 10px;
  color: #202c3b;
  width: 100%;
}

.invoice h2 {
  text-align: center;
  font-size: 26px;
}

.invoice-line {
  padding: 13px 0;
  border-bottom: 1px solid #e1e6eb;
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.invoice-amount {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  margin: 30px 0;
}

.invoice-signature { margin-top: 30px; }

.invoice-signature img {
  display: block;
  max-width: 300px;
  width: 100%;
  height: 100px;
  object-fit: contain;
  object-position: right center;
  border-bottom: 1px solid #777;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid #e5e9ee;
  padding: 14px 0;
}

.history-item button {
  padding: 8px 12px;
  font-size: 13px;
}

@media(max-width:550px) {
  .card { padding: 16px; }
  .invoice { padding: 17px; }
}

@media print {
  @page { size: A4; margin: 18mm; }

  body { background: white; }

  header, .form-card, .history-card, .preview-actions {
    display: none !important;
  }

  main { margin: 0; padding: 0; max-width: none; }

  #invoicePreview {
    display: block !important;
    box-shadow: none;
    border: none;
    padding: 0;
  }

  .invoice {
    display: block !important;
    border: none;
    padding: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>אדם סבג</h1>
  <p>מערכת חשבוניות דיגיטלית</p>
</header>

<main>

<section class="card form-card">

  <div class="company">
    <h2>אדם סבג</h2>
    <p><strong>עוסק פטור</strong></p>
    <p>מספר 324697150</p>
  </div>

  <h2>פרטי החשבונית</h2>

  <label>מספר חשבונית</label>
  <input id="number" placeholder="מספר חשבונית">

  <label>תאריך</label>
  <input id="date" type="date">

  <label>לכבוד</label>
  <input id="recipient" placeholder="שם המלון / הספא / הלקוח">

  <label>כתובת דואר אלקטרוני</label>
  <input id="emailAddress" type="email"
         placeholder="example@email.com"
         dir="ltr">

  <label>פרטים</label>
  <textarea id="details"
    placeholder="כתוב כאן את כל פרטי העבודה, השירות, האירוע, התאריכים וכל מידע נוסף..."></textarea>

  <label>סכום כולל לתשלום (₪)</label>
  <input id="amount" type="number" min="0" step="0.01"
    placeholder="הכנס סכום">

  <h2>חתימה דיגיטלית</h2>
  <p class="hint">חתום כאן באמצעות האצבע בטלפון או העכבר במחשב.</p>

  <canvas id="signature" width="1000" height="380"></canvas>

  <button class="secondary" onclick="clearSignature()">
    נקה חתימה
  </button>

  <div class="actions">
    <button class="primary" onclick="saveInvoice()">
      שמור חשבונית
    </button>

    <button class="secondary" onclick="newInvoice()">
      חשבונית חדשה
    </button>
  </div>

  <p id="message" class="hint" aria-live="polite"></p>

</section>


<section class="card" id="invoicePreview">

  <div class="invoice" id="paper"></div>

  <div class="actions preview-actions">

    <button class="primary" onclick="downloadPDF()">
      הורד חשבונית PDF
    </button>

    <button class="whatsapp" onclick="sendPDFWhatsApp()">
      שלח חשבונית PDF בוואטסאפ
    </button>

    <button class="email" onclick="sendPDFEmail()">
      שלח חשבונית במייל
    </button>

    <button class="secondary" onclick="window.print()">
      הדפס חשבונית
    </button>

  </div>

</section>


<section class="card history-card">
  <h2>חשבוניות שמורות</h2>
  <div id="history"></div>
</section>

</main>

<script>

const fields = [
  "number",
  "date",
  "recipient",
  "emailAddress",
  "details",
  "amount"
];

const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");

let drawing = false;
let hasSignature = false;
let editingId = null;

ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.strokeStyle = "#142b45";


// DATE

function today() {
  const d = new Date();
  const offset = d.getTimezoneOffset();

  return new Date(d.getTime() - offset * 60000)
    .toISOString().slice(0, 10);
}

document.getElementById("date").value = today();


// SIGNATURE

function getPosition(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height
  };
}

canvas.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  drawing = true;
  hasSignature = true;

  canvas.setPointerCapture(event.pointerId);

  const p = getPosition(event);

  ctx.beginPath();
  ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("pointermove", function(event) {
  if (!drawing) return;

  event.preventDefault();

  const p = getPosition(event);

  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

function stopDrawing() {
  drawing = false;
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("lostpointercapture", stopDrawing);

function clearSignature() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasSignature = false;
}

function getSignature() {
  return hasSignature ? canvas.toDataURL("image/png") : "";
}

function loadSignature(data) {
  clearSignature();

  if (!data) return;

  const img = new Image();

  img.onload = function() {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    hasSignature = true;
  };

  img.src = data;
}


// STORAGE

function getInvoices() {
  try {
    return JSON.parse(localStorage.getItem("adamInvoices") || "[]");
  } catch (error) {
    return [];
  }
}

function collectData() {
  const data = {};

  fields.forEach(id => {
    data[id] = document.getElementById(id).value.trim();
  });

  data.signature = getSignature();

  return data;
}


// SAVE

function saveInvoice() {

  const data = collectData();

  if (!data.recipient) {
    alert("נא למלא את השדה לכבוד");
    return;
  }

  if (!data.details) {
    alert("נא למלא את הפרטים");
    return;
  }

  if (!data.amount || Number(data.amount) <= 0) {
    alert("נא להזין סכום לתשלום");
    return;
  }

  if (!data.signature) {
    alert("נא לחתום לפני שמירת החשבונית");
    return;
  }

  if (!data.number) {
    data.number = String(Date.now()).slice(-8);
    document.getElementById("number").value = data.number;
  }

  if (!data.date) {
    data.date = today();
    document.getElementById("date").value = data.date;
  }

  const invoices = getInvoices();
  const id = editingId || String(Date.now());
  const index = invoices.findIndex(item => item.id === id);

  const invoice = {...data, id};

  if (index >= 0) invoices[index] = invoice;
  else invoices.unshift(invoice);

  try {
    localStorage.setItem("adamInvoices", JSON.stringify(invoices));
  } catch (error) {
    alert("אין מספיק מקום לשמירת החשבוניות בדפדפן.");
    return;
  }

  editingId = id;

  renderInvoice(invoice);
  renderHistory();

  document.getElementById("message").textContent =
    "החשבונית נשמרה בהצלחה!";
}


// SAFE HTML

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}


// INVOICE PREVIEW

function renderInvoice(data) {

  const paper = document.getElementById("paper");

  paper.style.display = "block";

  const signatureHTML = data.signature
    ? `<img src="${data.signature}" alt="חתימה דיגיטלית">`
    : "";

  const formattedAmount = Number(data.amount).toLocaleString("he-IL", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  paper.innerHTML = `

    <div class="company">
      <h2>אדם סבג</h2>
      <p><strong>עוסק פטור</strong></p>
      <p>מספר 324697150</p>
    </div>

    <h2>חשבונית</h2>

    <div class="invoice-line">
      <strong>מספר חשבונית:</strong>
      ${escapeHTML(data.number)}
    </div>

    <div class="invoice-line">
      <strong>תאריך:</strong>
      ${escapeHTML(data.date)}
    </div>

    <div class="invoice-line">
      <strong>לכבוד:</strong>
      ${escapeHTML(data.recipient)}
    </div>

    <div class="invoice-line">
      <strong>פרטים:</strong>
      ${escapeHTML(data.details)}
    </div>

    <div class="invoice-amount">
      סה"כ לתשלום: ${formattedAmount} ₪
    </div>

    <div class="invoice-signature">
      <strong>חתימה:</strong>
      ${signatureHTML}
    </div>

  `;

  document.getElementById("invoicePreview").style.display = "block";
}


// HISTORY

function renderHistory() {

  const history = document.getElementById("history");
  const invoices = getInvoices();

  if (invoices.length === 0) {
    history.innerHTML =
      "<p class='hint'>אין חשבוניות שמורות עדיין.</p>";
    return;
  }

  history.innerHTML = invoices.map(invoice => `

    <div class="history-item">

      <div>
        <strong>חשבונית ${escapeHTML(invoice.number)}</strong>
        <div class="hint">${escapeHTML(invoice.recipient)}</div>
        <div class="hint">${escapeHTML(invoice.date)}</div>
        <strong>${Number(invoice.amount).toLocaleString("he-IL")} ₪</strong>
      </div>

      <div>
        <button class="secondary"
          onclick="openInvoice('${invoice.id}')">
          פתח
        </button>

        <button class="danger"
          onclick="deleteInvoice('${invoice.id}')">
          מחק
        </button>
      </div>

    </div>

  `).join("");
}


// OPEN

function openInvoice(id) {

  const invoice = getInvoices().find(item => item.id === id);

  if (!invoice) return;

  fields.forEach(field => {
    document.getElementById(field).value = invoice[field] || "";
  });

  editingId = id;

  loadSignature(invoice.signature);
  renderInvoice(invoice);

  document.getElementById("message").textContent =
    "חשבונית נטענה לעריכה.";
}


// DELETE

function deleteInvoice(id) {

  if (!confirm("למחוק את החשבונית?")) return;

  const invoices = getInvoices().filter(item => item.id !== id);

  localStorage.setItem("adamInvoices", JSON.stringify(invoices));

  if (editingId === id) newInvoice();

  renderHistory();
}


// NEW

function newInvoice() {

  fields.forEach(field => {
    document.getElementById(field).value = "";
  });

  document.getElementById("date").value = today();

  clearSignature();
  editingId = null;

  document.getElementById("invoicePreview").style.display = "none";
  document.getElementById("message").textContent = "";
}


// PREPARE

function preparePreview() {

  const data = collectData();

  if (!data.recipient || !data.details ||
      !data.amount || Number(data.amount) <= 0) {
    alert("נא למלא את כל פרטי החשבונית");
    return false;
  }

  if (!data.signature) {
    alert("נא להוסיף חתימה דיגיטלית");
    return false;
  }

  if (!data.number) {
    data.number = String(Date.now()).slice(-8);
    document.getElementById("number").value = data.number;
  }

  if (!data.date) {
    data.date = today();
    document.getElementById("date").value = data.date;
  }

  renderInvoice(data);

  return true;
}


// WAIT FOR SIGNATURE IMAGE

async function waitForImages(container) {

  const images = Array.from(container.querySelectorAll("img"));

  await Promise.all(images.map(img => {

    if (img.complete && img.naturalWidth > 0) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });

  }));
}


// GENERATE PDF

async function generatePDFBlob() {

  if (!preparePreview()) return null;

  if (typeof html2pdf === "undefined") {
    alert("ספריית PDF לא נטענה. בדוק את חיבור האינטרנט.");
    return null;
  }

  const paper = document.getElementById("paper");

  await waitForImages(paper);

  const number = document.getElementById("number").value || "invoice";

  const worker = html2pdf().set({
    margin: 10,
    filename: `Facture-${number}.pdf`,
    image: {
      type: "jpeg",
      quality: 0.98
    },
    html2canvas: {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff"
    },
    jsPDF: {
      unit: "mm",
      format: "a4",
      orientation: "portrait"
    }
  }).from(paper).toPdf();

  const pdf = await worker.get("pdf");

  return pdf.output("blob");
}


// DOWNLOAD PDF

async function downloadPDF() {

  try {

    const blob = await generatePDFBlob();

    if (!blob) return;

    const number = document.getElementById("number").value || "invoice";

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = `Facture-${number}.pdf`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);

  } catch (error) {

    console.error(error);
    alert("שגיאה ביצירת קובץ PDF");

  }
}


// WHATSAPP

async function sendPDFWhatsApp() {

  try {

    const blob = await generatePDFBlob();

    if (!blob) return;

    const number = document.getElementById("number").value || "invoice";

    const file = new File(
      [blob],
      `Facture-${number}.pdf`,
      {type: "application/pdf"}
    );

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files: [file]})
    ) {

      await navigator.share({
        files: [file],
        title: "חשבונית אדם סבג",
        text: `חשבונית מספר ${number} - אדם סבג`
      });

      return;
    }

    downloadBlob(blob, `Facture-${number}.pdf`);

    window.open("https://web.whatsapp.com/", "_blank");

    alert("קובץ ה-PDF הורד. צרף אותו לשיחה בוואטסאפ.");

  } catch (error) {

    if (error.name === "AbortError") return;

    console.error(error);
    alert("לא ניתן להכין את קובץ ה-PDF.");

  }
}


// EMAIL

async function sendPDFEmail() {

  try {

    const email = document.getElementById("emailAddress").value.trim();

    if (!email) {
      alert("נא להזין כתובת דואר אלקטרוני.");
      document.getElementById("emailAddress").focus();
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      alert("כתובת הדואר האלקטרוני אינה תקינה.");
      return;
    }

    const blob = await generatePDFBlob();

    if (!blob) return;

    const number = document.getElementById("number").value || "invoice";

    const file = new File(
      [blob],
      `Facture-${number}.pdf`,
      {type: "application/pdf"}
    );

    const subject = `חשבונית מספר ${number} - אדם סבג`;

    const body =
      `שלום,\n\nמצורפת חשבונית מספר ${number} מאדם סבג.\n\nתודה רבה!`;

    // On browsers supporting file sharing,
    // the user can choose an email app from the share menu.

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files: [file]})
    ) {

      await navigator.share({
        files: [file],
        title: subject,
        text: body
      });

      return;
    }

    // Fallback for desktop browsers:
    // Download PDF and open a new email draft.

    downloadBlob(blob, `Facture-${number}.pdf`);

    const mailto =
      `mailto:${encodeURIComponent(email)}` +
      `?subject=${encodeURIComponent(subject)}` +
      `&body=${encodeURIComponent(
        body + "\n\nLe fichier PDF a été téléchargé. Veuillez le joindre à ce message."
      )}`;

    window.location.href = mailto;

    alert(
      "Le PDF a été téléchargé. Le message e-mail est prêt : ajoute le PDF en pièce jointe avant de l'envoyer."
    );

  } catch (error) {

    if (error.name === "AbortError") return;

    console.error(error);
    alert("Erreur lors de la préparation de l'e-mail.");

  }
}


// DOWNLOAD HELPER

function downloadBlob(blob, filename) {

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 60000);
}


// START

renderHistory();

</script>

</body>
</html>
